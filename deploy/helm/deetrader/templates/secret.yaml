{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deetrader.secretName" . }}
  labels:
    {{- include "deetrader.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ required "secrets.secretKey is required when secrets.create=true" .Values.secrets.secretKey | quote }}
  ADMIN_PASSWORD: {{ required "secrets.adminPassword is required when secrets.create=true" .Values.secrets.adminPassword | quote }}
  DATABASE_URL: {{ required "secrets.databaseUrl is required when secrets.create=true" .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ required "secrets.redisUrl is required when secrets.create=true" .Values.secrets.redisUrl | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required when secrets.create=true" .Values.secrets.postgresPassword | quote }}
  IBKR_ACCOUNT_ID: {{ .Values.secrets.ibkrAccountId | quote }}
  IBKR_ACCESS_TOKEN: {{ .Values.secrets.ibkrAccessToken | quote }}
{{- end }}
