limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
server {
  listen 80;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  location /api/ { limit_req zone=api burst=40 nodelay; proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /health { proxy_pass http://backend:8000; }
  location /metrics { deny all; }
  location /ws/ { proxy_pass http://backend:8000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location / { proxy_pass http://frontend:3000; proxy_set_header Host $host; }
}
