name: deetrader
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deetrader}
      POSTGRES_USER: ${POSTGRES_USER:-deetrader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 5}
    networks: [internal]
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes","--maxmemory","256mb","--maxmemory-policy","noeviction"]
    volumes: [redis_data:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 5}
    networks: [internal]
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 20s, timeout: 5s, retries: 5}
    networks: [internal]
    extra_hosts: ["host.docker.internal:host-gateway"]
    deploy: {resources: {limits: {memory: 512M}}}
  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    command: ["python","-m","app.workers.runner"]
    depends_on:
      backend: {condition: service_healthy}
    networks: [internal]
    deploy: {resources: {limits: {memory: 256M}}}
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    depends_on:
      backend: {condition: service_healthy}
    networks: [internal]
    deploy: {resources: {limits: {memory: 384M}}}
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80"]
    volumes: ["./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [frontend, backend]
    networks: [internal]
  prometheus:
    image: prom/prometheus:v3.4.2
    restart: unless-stopped
    profiles: [monitoring]
    volumes: ["./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus_data:/prometheus"]
    networks: [internal]
  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    profiles: [monitoring]
    volumes: [grafana_data:/var/lib/grafana]
    networks: [internal]
networks:
  internal: {driver: bridge}
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
