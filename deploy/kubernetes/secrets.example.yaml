apiVersion: v1
kind: Secret
metadata:
  name: deetrader-secrets
type: Opaque
stringData:
  SECRET_KEY: replace-with-at-least-32-random-characters
  ADMIN_PASSWORD: replace-with-a-strong-administrator-password
  POSTGRES_PASSWORD: replace-with-a-strong-database-password
  DATABASE_URL: postgresql+asyncpg://deetrader:replace-password@deetrader-postgresql:5432/deetrader
  REDIS_URL: redis://deetrader-redis:6379/0
  IBKR_ACCOUNT_ID: ""
  IBKR_ACCESS_TOKEN: ""
