imagePullSecrets:
  - name: artifactory-regcred

frontend:
  image:
    repository: artifactory.example.com/docker-local/deetrader-frontend
    tag: 0.1.0
    pullPolicy: IfNotPresent

backend:
  image:
    repository: artifactory.example.com/docker-local/deetrader-backend
    tag: 0.1.0
    pullPolicy: IfNotPresent

secrets:
  create: false
  existingSecret: deetrader-secrets

ingress:
  host: deetrader.example.com
  tls:
    enabled: true
    secretName: deetrader-tls

config:
  corsOrigins: '["https://deetrader.example.com"]'

# In production, prefer managed PostgreSQL and Redis and set their URLs in
# deetrader-secrets. Disable these two bundled StatefulSets in that case.
postgresql:
  enabled: true
redis:
  enabled: true
